spring.application.name=l3gl-money
server.port=8085
spring.web.error.include-message=always

logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter= DEBUG

#Conf base de donnees
spring.datasource.url=jdbc:mysql://localhost:3306/l3glmoney?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Aller#123@

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Donnees a exposer
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true

#Conf opentelemetry pour l'export des donnees (logs, metriques, traces)
otel.service.name=l3gl-money
otel.exporter.otlp.endpoint=http://20.105.174.114:8200
otel.exporter.otlp.protocol=grpc
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp
otel.java.global-autoconfigure.enabled=true

#Attributs supplementaires (nom du service, version, environment)
otel.resource.attributes=service.name=l3gl-money,service.version=0.0.1,deployment.environment=l3gl-money-dev
